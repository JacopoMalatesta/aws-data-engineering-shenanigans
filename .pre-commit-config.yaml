# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

repos:
  - repo: local
    hooks:
      - id: ruff-lint-fix
        name: ruff check --fix
        entry: ./.venv/bin/ruff
        args:
          - check
          - --fix
        language: unsupported
        types_or:
          - python
          - pyi
      - id: ruff-format
        name: ruff format
        entry: ./.venv/bin/ruff
        args:
          - format
        language: unsupported
        types_or:
          - python
          - pyi
      - id: ty-check
        name: ty check
        entry: ./.venv/bin/ty
        args:
          - check
          - --error-on-warning
          - .
        language: unsupported
        pass_filenames: false
        files: \.py$
      - id: basedpyright-check
        name: basedpyright
        entry: ./.venv/bin/basedpyright
        args: []
        language: unsupported
        pass_filenames: false
        files: \.py$
