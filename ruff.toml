# Ruff configuration - hand-authored (projen has no Ruff component to
# manage this file). Reference: https://docs.astral.sh/ruff/configuration/

target-version = "py313"
line-length = 88

[format]
# Stable formatter style (preview intentionally off to avoid churn).
# The formatter owns line wrapping, which is why E501 is disabled below.

[lint]
preview = true
select = ["ALL"]
ignore = [
    # Rules that conflict with the ruff formatter:
    # https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",                              # W191
    "indentation-with-invalid-multiple",            # E111
    "indentation-with-invalid-multiple-comment",    # E114
    "over-indented",                                # E117
    "incorrect-blank-line-before-class",            # D203 (D211 preferred)
    "docstring-tab-indentation",                    # D206
    "triple-single-quotes",                         # D300
    "bad-quotes-inline-string",                     # Q000
    "bad-quotes-multiline-string",                  # Q001
    "bad-quotes-docstring",                         # Q002
    "avoidable-escaped-quote",                      # Q003
    "missing-trailing-comma",                       # COM812
    "prohibited-trailing-comma",                    # COM819
    "multi-line-implicit-string-concatenation",     # ISC002
    # The formatter governs wrapping (best-effort only), so the linter
    # must not fight it over line length.
    "line-too-long",                                # E501
    # Framework-specific rule families for libraries this repo doesn't use.
    "AIR",    # airflow
    "DJ",     # django
    "FAST",   # fastapi
    "NPY",    # numpy
    "PD",     # pandas
    # Noisy preview rules observed with select=ALL; re-evaluate on upgrades.
    "missing-copyright-notice",                     # CPY001
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
# Tests may use plain asserts and don't need module/class/method/function
# docstrings; every other rule (including annotations) still applies.
"tests/**" = ["assert", "undocumented-public-module", "undocumented-public-class", "undocumented-public-method", "undocumented-public-function", "undocumented-public-package"]
# Projen-managed package markers can't carry docstrings.
"**/__init__.py" = ["undocumented-public-package"]
