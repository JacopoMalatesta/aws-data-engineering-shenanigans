# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

language: en-US
early_access: true
chat:
  art: false
knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: auto
  web_search:
    enabled: true
reviews:
  profile: assertive
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    ignore_title_keywords:
      - WIP
      - "[skip review]"
      - DO NOT REVIEW
    ignore_usernames:
      - dependabot[bot]
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  in_progress_fortune: false
  suggested_reviewers: false
  review_status: true
  review_info: true
  review_details: false
  slop_detection:
    enabled: true
    include_all_authors: true
    label: slop
  auto_approvals:
    enabled: false
  pre_merge_checks:
    title:
      mode: off
    description:
      mode: warning
  path_filters:
    - "!dist/**"
    - "!cdk.out/**"
    - "!.projen/**"
    - "!uv.lock"
    - "!.venv/**"
    - "!.pytest_cache/**"
    - "!.ruff_cache/**"
    - "!.coverage"
    - "!tmp/**"
    - "!*.egg-info/**"
  tools:
    actionlint:
      enabled: false
    ast-grep:
      enabled: false
    biome:
      enabled: false
    flake8:
      enabled: false
    github-checks:
      enabled: false
    gitleaks:
      enabled: false
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    opengrep:
      enabled: false
    osvScanner:
      enabled: false
    presidio:
      enabled: false
    pylint:
      enabled: false
    ruff:
      enabled: false
    semgrep:
      enabled: false
    trufflehog:
      enabled: false
    yamllint:
      enabled: false
    zizmor:
      enabled: false
