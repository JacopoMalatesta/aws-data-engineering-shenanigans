# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

[project]
name = "aws-data-engineering-shenanigans"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
  "aws-cdk-lib>=2.275.0,<3.0.0",
  "cdk-nag==3.0.2",
  "constructs>=10.5.1,<11.0.0"
]

  [[project.authors]]
  name = "JacopoMalatesta"
  email = "jacopomalatesta95@gmail.com"

[dependency-groups]
dev = [
  "basedpyright==1.40.2",
  "deptry==0.25.1",
  "pre-commit==4.7.0",
  "projen==0.104.27",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
  "shellcheck-py==0.11.0.1",
  "shfmt-py==4.2.0",
  "ty==0.0.99",
  "pytest==9.2.0"
]

[tool.setuptools.packages.find]
include = [ "aws_data_engineering_shenanigans*" ]

[tool.ruff]
target-version = "py313"
line-length = 88

  [tool.ruff.lint]
  preview = true
  select = [ "ALL" ]
  ignore = [
  "AIR",
  "DJ",
  "FAST",
  "NPY",
  "PD",
  "avoidable-escaped-quote",
  "bad-quotes-docstring",
  "bad-quotes-inline-string",
  "bad-quotes-multiline-string",
  "docstring-tab-indentation",
  "incorrect-blank-line-before-class",
  "indentation-with-invalid-multiple",
  "indentation-with-invalid-multiple-comment",
  "line-too-long",
  "missing-copyright-notice",
  "missing-trailing-comma",
  "multi-line-implicit-string-concatenation",
  "over-indented",
  "prohibited-trailing-comma",
  "tab-indentation",
  "triple-single-quotes"
]

    [tool.ruff.lint.pydocstyle]
    convention = "google"

    [tool.ruff.lint.per-file-ignores]
    "tests/**" = [
  "assert",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-package"
]
    "**/__init__.py" = [ "undocumented-public-package" ]

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.basedpyright]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "all"
enableBasedFeatures = true
failOnWarnings = true
exclude = [ "cdk.out", "dist", ".venv", "node_modules", "**/__pycache__" ]

[tool.deptry.per_rule_ignores]
DEP004 = [ "projen" ]

[tool.pytest.ini_options]
addopts = "-vv -ra --durations=10 --cov=aws_data_engineering_shenanigans --cov-report=term-missing"
testpaths = [ "tests" ]
