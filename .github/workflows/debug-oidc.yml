name: debug-oidc
on:
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-west-1
    steps:
      - name: Decode OIDC token claims and call STS directly
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 -c "
          import base64, json
          t = '''$TOKEN'''.strip()
          p = t.split('.')[1]
          p += '=' * (-len(p) % 4)
          print(json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=2))
          "
          echo "--- direct STS assume-role ---"
          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::925000840053:role/github-actions-deploy" \
            --role-session-name debug-oidc \
            --web-identity-token "$TOKEN" 2>&1 | head -10
