# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

name: pr-reviewer
on:
  pull_request_target:
    types:
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize
jobs:
  review-code:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Trigger code review
        id: trigger_code_review
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IGNORE_TITLE_KEYWORDS_JSON: '["WIP", "[skip review]", "DO NOT REVIEW"]'
          IGNORED_USERNAMES_JSON: '["dependabot[bot]"]'
        run: |
          #!/usr/bin/env bash
          # Trigger script for the PR reviewer workflow: reads the event payload
          # from GITHUB_EVENT_PATH, applies the skip rules rendered by projen into
          # the JSON env vars below, then comments "@coderabbitai review" (fresh
          # comment per event — editing wouldn't re-trigger).
          #
          # Payload-only by design: the workflow intentionally has no checkout step,
          # so the zizmor dangerous-triggers ignore for pr-reviewer.yml stays valid.
          # Env: GH_REPO, GH_TOKEN, PR_NUMBER, GITHUB_EVENT_PATH (from the workflow);
          # IGNORE_TITLE_KEYWORDS_JSON / IGNORED_USERNAMES_JSON are rendered by
          # projen from the constants that also generate .coderabbit.yaml.
          set -euo pipefail

          GH_REPO="${GH_REPO:?GH_REPO must be set}"
          export GH_TOKEN="${GH_TOKEN:?GH_TOKEN must be set}"
          PR_NUMBER="${PR_NUMBER:?PR_NUMBER must be set}"
          GITHUB_EVENT_PATH="${GITHUB_EVENT_PATH:?GITHUB_EVENT_PATH must be set}"
          IGNORE_TITLE_KEYWORDS_JSON="${IGNORE_TITLE_KEYWORDS_JSON:-[]}"
          IGNORED_USERNAMES_JSON="${IGNORED_USERNAMES_JSON:-[]}"

          action="$(jq -r '.action' "${GITHUB_EVENT_PATH}")"
          draft="$(jq -r '.pull_request.draft' "${GITHUB_EVENT_PATH}")"
          login="$(jq -r '.pull_request.user.login' "${GITHUB_EVENT_PATH}")"
          title="$(jq -r '.pull_request.title // ""' "${GITHUB_EVENT_PATH}")"
          title_change="$(jq -r '.changes.title // empty' "${GITHUB_EVENT_PATH}")"

          if [[ "${action}" == "edited" && -z "${title_change}" ]]; then
            echo "Skipping review trigger: edit did not change the title."
            exit 0
          fi

          # Parse the projen-rendered JSON lists through assignments so jq's exit
          # status propagates under set -e (a process substitution would mask it);
          # empty lists yield an empty string, so the arrays stay empty.
          bots="$(jq -r '.[]' <<<"${IGNORED_USERNAMES_JSON}")"
          ignored_bots=()
          if [[ -n "${bots}" ]]; then
            mapfile -t ignored_bots <<<"${bots}"
          fi
          for bot_login in "${ignored_bots[@]}"; do
            if [[ "${login}" == "${bot_login}" ]]; then
              echo "Skipping review trigger: ignored bot author."
              exit 0
            fi
          done

          if [[ "${draft}" == "true" ]]; then
            echo "Skipping review trigger: draft PR."
            exit 0
          fi

          keywords="$(jq -r '.[]' <<<"${IGNORE_TITLE_KEYWORDS_JSON}")"
          skip_keywords=()
          if [[ -n "${keywords}" ]]; then
            mapfile -t skip_keywords <<<"${keywords}"
          fi
          for keyword in "${skip_keywords[@]}"; do
            # ${var,,} lowercases for the case-insensitive match grep -qiF used to do.
            if [[ "${title,,}" == *"${keyword,,}"* ]]; then
              echo "Skipping review trigger: PR title contains '${keyword}'."
              exit 0
            fi
          done

          gh pr comment "${PR_NUMBER}" --body "@coderabbitai review"
