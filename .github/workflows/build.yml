# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

name: build
on:
  pull_request: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - id: auto_600da1d4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: auto_8ec28ed8
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
      - id: auto_f666a58d
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install CDK CLI
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1146.1
      - name: Install dependencies
        id: install_dependencies
        run: uv sync --frozen
      - name: Regenerate projen files
        id: regenerate_projen_files
        run: npx projen@0.104.17 --no-post --debug
      - name: Lint
        id: lint
        run: npx projen@0.104.17 lint
      - name: Format check
        id: format_check
        run: npx projen@0.104.17 format:check
      - name: Type check
        id: type_check
        run: npx projen@0.104.17 typecheck
      - name: Unit tests
        id: unit_tests
        run: npx projen@0.104.17 test
      - name: Export constants from constants.py
        id: export_constants_from_constants_py
        run: |
          echo "AWS_ACCOUNT_ID=$(uv run python -c 'from constants import AWS_ACCOUNT_ID; print(AWS_ACCOUNT_ID)')" >> "$GITHUB_ENV"
          echo "AWS_REGION=$(uv run python -c 'from constants import AWS_REGION; print(AWS_REGION)')" >> "$GITHUB_ENV"
      - name: Configure AWS credentials via OIDC
        id: configure_aws_credentials_via_oidc
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - name: CDK synth
        id: cdk_synth
        run: npx projen@0.104.17 synth
      - name: CDK diff
        id: cdk_diff
        run: npx projen@0.104.17 diff > cdk-diff.txt || true
      - name: Post CDK diff to PR
        id: post_cdk_diff_to_pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DIFF_BODY_FILE=cdk-diff-comment.md
          {
            echo '<!-- cdk-diff -->'
            echo '## 📋 cdk diff'
            if [ -s cdk-diff.txt ]; then
              echo '```text'
              cat cdk-diff.txt
              echo '```'
            else
              echo '✅ No infrastructure changes.'
            fi
          } > "$DIFF_BODY_FILE"
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body-file "$DIFF_BODY_FILE"
      - name: Package
        id: package
        run: npx projen@0.104.17 package
