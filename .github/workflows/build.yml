# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

name: build
on:
  pull_request: {}
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Regenerate projen files
        id: regenerate_projen_files
        run: npx projen@0.104.17 --no-post --debug
      - name: Regeneration drift check
        id: regeneration_drift_check
        run: git diff --exit-code
      - name: YAML lint
        id: yaml_lint
        run: |-
          uvx --isolated yamllint@1.38.0 --version
          npx projen@0.104.17 yaml-lint
      - name: Shell lint
        id: shell_lint
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            --sha256 b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 \
            --tool shellcheck --kind tar
          shellcheck --version
          npx projen@0.104.17 shell-lint
      - name: Shell format check
        id: shell_format_check
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 \
            --sha256 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf \
            --tool shfmt --kind raw
          shfmt --version
          npx projen@0.104.17 format:shell
      - name: GitHub Actions lint
        id: github_actions_lint
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --sha256 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            --tool actionlint --kind tar
          actionlint --version
          npx projen@0.104.17 github-actions-lint
      - name: TOML lint
        id: toml_lint
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            --sha256 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156 \
            --tool taplo --kind gzip
          taplo --version
          npx projen@0.104.17 toml-lint
      - name: Python lint
        id: python_lint
        run: npx projen@0.104.17 lint
      - name: Python format check
        id: python_format_check
        run: npx projen@0.104.17 format:check
      - name: Python typecheck
        id: python_typecheck
        run: npx projen@0.104.17 typecheck
      - name: Python static analysis
        id: python_static_analysis
        run: npx projen@0.104.17 static-analysis
      - name: Python dependency lint
        id: python_dependency_lint
        run: npx projen@0.104.17 dependency-lint
      - name: Python unit tests
        id: python_unit_tests
        run: npx projen@0.104.17 test
      - name: Package Python code
        id: package_python_code
        run: npx projen@0.104.17 package
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Install CDK CLI
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1146.1
      - name: AWS credentials via OIDC
        id: aws_credentials_via_oidc
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::${{ matrix.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ matrix.region_name }}
      - name: CDK synth
        id: cdk_synth
        run: npx projen@0.104.17 synth
      - name: CDK diff capture
        id: cdk_diff_capture
        run: npx projen@0.104.17 diff > cdk-diff.txt || true
      - name: Post CDK diff
        id: post_cdk_diff
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          #!/usr/bin/env bash
          # Edit or post the cdk-diff summary comment on the current pull request.
          # Env: GH_REPO, GH_TOKEN, PR_NUMBER (injected by the build workflow).
          set -euo pipefail

          GH_REPO="${GH_REPO:?GH_REPO must be set}"
          export GH_TOKEN="${GH_TOKEN:?GH_TOKEN must be set}"
          PR_NUMBER="${PR_NUMBER:?PR_NUMBER must be set}"

          DIFF_BODY_FILE=cdk-diff-comment.md
          {
            echo '<!-- cdk-diff -->'
            echo '## 📋 cdk diff'
            if [[ -s cdk-diff.txt ]]; then
              echo '```text'
              cat cdk-diff.txt
              echo '```'
            else
              echo '✅ No infrastructure changes.'
            fi
          } >"${DIFF_BODY_FILE}"
          # Edit only the marked cdk-diff comment (--edit-last would rewrite the
          # reviewer's trigger comment); post fresh if none found.
          # Search every comment page (--paginate applies the filter per page, so the
          # last-id pick happens in bash across the flattened stream).
          COMMENT_ID="$(gh api --paginate "repos/${GH_REPO}/issues/${PR_NUMBER}/comments?per_page=100" --jq '
            .[]
            | select(
              .user.login == "github-actions[bot]"
              and (.body | contains("<!-- cdk-diff -->"))
            )
            | .id' | tail -n1)"
          if [[ -n "${COMMENT_ID}" ]]; then
            gh api -X PATCH "repos/${GH_REPO}/issues/comments/${COMMENT_ID}" -F body=@"${DIFF_BODY_FILE}" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -F body=@"${DIFF_BODY_FILE}" >/dev/null
          fi
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - environment_name: dev
            aws_account_id: "925000840053"
            region_name: eu-west-1
