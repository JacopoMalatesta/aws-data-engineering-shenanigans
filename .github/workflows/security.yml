# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

name: security
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Install CDK CLI
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1146.1
      - name: Secret scan
        id: secret_scan
        run: |-
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow
          fi
          curl -fsSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb /tmp/gitleaks.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
          npx projen@0.104.17 security:secret-scan
        background: true
      - name: SAST scan
        id: sast_scan
        run: |-
          curl -fsSL -o /tmp/opengrep https://github.com/opengrep/opengrep/releases/download/v1.33.0/opengrep_manylinux_x86
          printf '%s  %s\n' 2545812755572e1355ea60f96288f82a26eebed7fc8b512430d49d5667214c24 /tmp/opengrep | sha256sum --check --strict -
          sudo install -m 0755 /tmp/opengrep /usr/local/bin/opengrep
          opengrep --version
          npx projen@0.104.17 security:sast
        background: true
      - name: Misconfig scan
        id: misconfig_scan
        run: |-
          curl -fsSL -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz
          printf '%s  %s\n' c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 /tmp/trivy.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version
          npx projen@0.104.17 security:misconfig-scan
        background: true
      - name: SCA Python
        id: sca_python
        run: npx projen@0.104.17 security:sca-python
        background: true
      - name: IaC scan
        id: iac_scan
        run: |-
          npx projen@0.104.17 synth:silent
          uvx --isolated checkov@3.4.0 --version
          npx projen@0.104.17 security:iac-scan
        background: true
      - name: GitHub Actions scan
        id: github_actions_scan
        run: |-
          curl -fsSL -o /tmp/zizmor.tar.gz https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99 /tmp/zizmor.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/zizmor.tar.gz -C /tmp
          sudo install -m 0755 /tmp/zizmor /usr/local/bin/zizmor
          zizmor --version
          npx projen@0.104.17 security:git-hub-actions-scan
        background: true
      - name: SCA multi-language
        id: sca_multi-language
        run: |-
          curl -fsSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          printf '%s  %s\n' 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b /tmp/osv-scanner | sha256sum --check --strict -
          sudo install -m 0755 /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
          npx projen@0.104.17 security:sca-multi-language
        background: true
      - name: Dockerfile scan
        id: dockerfile_scan
        run: |-
          curl -fsSL -o /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          printf '%s  %s\n' c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 /tmp/hadolint | sha256sum --check --strict -
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          hadolint --version
          npx projen@0.104.17 security:dockerfile-lint
        background: true
      - name: Wait for scans
        id: wait_for_scans
        wait-all: true
