name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auto_600da1d4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: auto_8ec28ed8
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          python-version: "3.13"
      - id: auto_f666a58d
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install CDK CLI
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1146.1
      - name: Install dependencies
        id: install_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Lint
        id: lint
        run: npx projen@0.104.17 lint
      - name: Format check
        id: format_check
        run: npx projen@0.104.17 format:check
      - name: Type check
        id: type_check
        run: npx projen@0.104.17 typecheck
      - name: Unit tests
        id: unit_tests
        run: npx projen@0.104.17 test
      - name: Export constants from constants.py
        id: export_constants_from_constants_py
        run: |
          echo "AWS_ACCOUNT_ID=$(uv run python -c 'from constants import AWS_ACCOUNT_ID; print(AWS_ACCOUNT_ID)')" >> "$GITHUB_ENV"
          echo "AWS_REGION=$(uv run python -c 'from constants import AWS_REGION; print(AWS_REGION)')" >> "$GITHUB_ENV"
      - name: Configure AWS credentials via OIDC
        id: configure_aws_credentials_via_oidc
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
