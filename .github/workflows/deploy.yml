# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Regenerate projen files
        id: regenerate_projen_files
        run: npx projen@0.104.17 --no-post --debug
      - name: Regeneration drift check
        id: regeneration_drift_check
        run: git diff --exit-code
      - name: YAML lint
        id: yaml_lint
        run: |-
          uvx --isolated yamllint@1.38.0 --version
          npx projen@0.104.17 yaml-lint
      - name: GitHub Actions lint
        id: github_actions_lint
        run: |-
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 /tmp/actionlint.tar.gz | sha256sum --check --strict -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
          npx projen@0.104.17 github-actions-lint
      - name: TOML lint
        id: toml_lint
        run: |-
          curl -fsSL -o /tmp/taplo.gz https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          printf '%s  %s\n' 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156 /tmp/taplo.gz | sha256sum --check --strict -
          gunzip /tmp/taplo.gz
          sudo install -m 0755 /tmp/taplo /usr/local/bin/taplo
          taplo --version
          npx projen@0.104.17 toml-lint
      - name: Python lint
        id: python_lint
        run: npx projen@0.104.17 lint
      - name: Python format check
        id: python_format_check
        run: npx projen@0.104.17 format:check
      - name: Python typecheck
        id: python_typecheck
        run: npx projen@0.104.17 typecheck
      - name: Python static analysis
        id: python_static_analysis
        run: npx projen@0.104.17 static-analysis
      - name: Python dependency lint
        id: python_dependency_lint
        run: npx projen@0.104.17 dependency-lint
      - name: Python unit tests
        id: python_unit_tests
        run: npx projen@0.104.17 test
      - name: Package Python code
        id: package_python_code
        run: npx projen@0.104.17 package
  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Install CDK CLI
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1146.1
      - name: AWS credentials via OIDC
        id: aws_credentials_via_oidc
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::${{ matrix.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ matrix.region_name }}
      - name: CDK diff
        id: cdk_diff
        run: npx projen@0.104.17 diff
      - name: CDK deploy
        id: cdk_deploy
        run: npx projen@0.104.17 deploy "*-${{ matrix.environment_name }}"
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - environment_name: dev
            aws_account_id: "925000840053"
            region_name: eu-west-1
