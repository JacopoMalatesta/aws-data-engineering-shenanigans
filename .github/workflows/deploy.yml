# ~~ Generated by projen. To modify, edit .projenrc.py and run "npx projen".

name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Regenerate projen files
        id: regenerate_projen_files
        run: npx projen@0.104.17 --no-post --debug
      - name: Regeneration drift check
        id: regeneration_drift_check
        run: git diff --exit-code
      - name: YAML lint
        id: yaml_lint
        run: |-
          uvx --isolated yamllint@1.38.0 --version
          npx projen@0.104.17 yaml-lint
      - name: Shell lint
        id: shell_lint
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            --sha256 b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 \
            --tool shellcheck --kind tar
          shellcheck --version
          npx projen@0.104.17 shell-lint
      - name: Shell format check
        id: shell_format_check
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 \
            --sha256 76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf \
            --tool shfmt --kind raw
          shfmt --version
          npx projen@0.104.17 format:shell
      - name: GitHub Actions lint
        id: github_actions_lint
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --sha256 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            --tool actionlint --kind tar
          actionlint --version
          npx projen@0.104.17 github-actions-lint
      - name: TOML lint
        id: toml_lint
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz \
            --sha256 8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156 \
            --tool taplo --kind gzip
          taplo --version
          npx projen@0.104.17 toml-lint
      - name: Python lint
        id: python_lint
        run: npx projen@0.104.17 lint
      - name: Python format check
        id: python_format_check
        run: npx projen@0.104.17 format:check
      - name: Python typecheck
        id: python_typecheck
        run: npx projen@0.104.17 typecheck
      - name: Python static analysis
        id: python_static_analysis
        run: npx projen@0.104.17 static-analysis
      - name: Python dependency lint
        id: python_dependency_lint
        run: npx projen@0.104.17 dependency-lint
      - name: Python unit tests
        id: python_unit_tests
        run: npx projen@0.104.17 test
      - name: Package Python code
        id: package_python_code
        run: npx projen@0.104.17 package
  scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Install CDK CLI
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1146.1
      - name: Secret scan
        id: secret_scan
        run: |-
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow
          fi
          bash scripts/install-tool.sh \
            --url https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --sha256 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            --tool gitleaks --kind tar
          gitleaks version
          npx projen@0.104.17 security:secret-scan
        background: true
      - name: SAST scan
        id: sast_scan
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/opengrep/opengrep/releases/download/v1.33.0/opengrep_manylinux_x86 \
            --sha256 2545812755572e1355ea60f96288f82a26eebed7fc8b512430d49d5667214c24 \
            --tool opengrep --kind raw
          opengrep --version
          npx projen@0.104.17 security:sast
        background: true
      - name: Misconfig scan
        id: misconfig_scan
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
            --sha256 c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0 \
            --tool trivy --kind tar
          trivy --version
          npx projen@0.104.17 security:misconfig-scan
        background: true
      - name: SCA Python
        id: sca_python
        run: npx projen@0.104.17 security:sca-python
        background: true
      - name: IaC scan
        id: iac_scan
        run: |-
          npx projen@0.104.17 synth:silent
          uvx --isolated checkov@3.4.0 --version
          npx projen@0.104.17 security:iac-scan
        background: true
      - name: GitHub Actions scan
        id: github_actions_scan
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            --sha256 d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99 \
            --tool zizmor --kind tar
          zizmor --version
          npx projen@0.104.17 security:git-hub-actions-scan
        background: true
      - name: SCA multi-language
        id: sca_multi-language
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 \
            --sha256 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b \
            --tool osv-scanner --kind raw
          osv-scanner --version
          npx projen@0.104.17 security:sca-multi-language
        background: true
      - name: Dockerfile scan
        id: dockerfile_scan
        run: |-
          bash scripts/install-tool.sh \
            --url https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            --sha256 c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507 \
            --tool hadolint --kind raw
          hadolint --version
          npx projen@0.104.17 security:dockerfile-lint
        background: true
      - name: Wait for scans
        id: wait_for_scans
        wait-all: true
      - name: Upload security SARIF
        id: upload_security_sarif
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@f3bbb05694c2f74569081c28664c0866d64dec21
        with:
          sarif_file: tmp/sarif
          category: security
          wait-for-processing: false
  deploy:
    needs:
      - check
      - scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        id: checkout_repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        id: install_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.13"
      - name: Install Node
        id: install_node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install Python dependencies
        id: install_python_dependencies
        run: uv sync --frozen
      - name: Install projen CLI
        id: install_projen_cli
        run: npm install -g projen@0.104.17
      - name: Install CDK CLI
        id: install_cdk_cli
        run: npm install -g aws-cdk@2.1146.1
      - name: AWS credentials via OIDC
        id: aws_credentials_via_oidc
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: arn:aws:iam::${{ matrix.aws_account_id }}:role/github-actions-deploy
          aws-region: ${{ matrix.region_name }}
      - name: CDK diff
        id: cdk_diff
        run: npx projen@0.104.17 diff
      - name: CDK deploy
        id: cdk_deploy
        run: npx projen@0.104.17 deploy "*-${{ matrix.environment_name }}"
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - environment_name: dev
            aws_account_id: "925000840053"
            region_name: eu-west-1
